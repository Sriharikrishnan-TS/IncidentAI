version: "3.9"

services:
  neo4j:
    image: neo4j:5.22
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH:-neo4j/password}

  chromadb:
    image: chromadb/chroma:0.5.5
    ports:
      - "8001:8000"

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ../frontend:/app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backend:
    image: golang:1.22-alpine
    working_dir: /app
    volumes:
      - ../backend-go:/app
    command: sh -c "go mod tidy && go run ."
    ports:
      - "8080:8080"

  ai-engine:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ../ai-engine:/app
    command: sh -c "pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
